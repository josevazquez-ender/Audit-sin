<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría de Equipos - Sistema Central</title>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen pb-10">

    <div class="max-w-lg mx-auto bg-white shadow-2xl min-h-screen md:min-h-fit md:mt-10 md:rounded-2xl overflow-hidden">
        <div class="bg-blue-700 p-6 text-white">
            <h1 class="text-xl font-bold text-center">Auditoría de Inventario</h1>
            <p class="text-blue-100 text-xs text-center mt-1">Capture la foto del equipo para validar metadatos</p>
        </div>

        <div class="p-6 space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="col-span-2">
                    <label class="block text-xs font-bold text-gray-500 uppercase">Nombre del Promotor</label>
                    <input type="text" id="nombre" class="w-full border-b-2 border-gray-200 py-2 outline-none focus:border-blue-500 transition" placeholder="Ej: Juan Pérez">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase">ID Honor</label>
                    <input type="text" id="idHonor" class="w-full border-b-2 border-gray-200 py-2 outline-none focus:border-blue-500 transition" placeholder="12345">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase">Región</label>
                    <select id="region" class="w-full border-b-2 border-gray-200 py-2 outline-none focus:border-blue-500 bg-white">
                        <option value="Norte">Norte</option>
                        <option value="Sur">Sur</option>
                        <option value="Este">Este</option>
                        <option value="Oeste">Oeste</option>
                        <option value="Centro">Centro</option>
                    </select>
                </div>
                <div class="col-span-2">
                    <label class="block text-xs font-bold text-gray-500 uppercase">Sucursal</label>
                    <input type="text" id="sucursal" class="w-full border-b-2 border-gray-200 py-2 outline-none focus:border-blue-500 transition" placeholder="Nombre de tienda/sucursal">
                </div>
            </div>

            <hr>

            <div class="space-y-3">
                <label class="block text-sm font-bold text-gray-700">Evidencia Fotográfica</label>
                <label class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-blue-200 rounded-xl cursor-pointer bg-blue-50 hover:bg-blue-100 transition relative overflow-hidden">
                    <div id="uploadPrompt" class="flex flex-col items-center">
                        <svg class="w-10 h-10 text-blue-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><circle cx="12" cy="13" r="3" stroke-width="2"/></svg>
                        <span class="text-blue-600 font-medium">Abrir Cámara</span>
                    </div>
                    <img id="preview" class="absolute inset-0 w-full h-full object-cover hidden">
                    <input type="file" id="foto" accept="image/*" capture="environment" class="hidden">
                </label>
            </div>

            <button id="btnEnviar" disabled class="w-full bg-gray-400 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95">
                ENVIAR REPORTE
            </button>
            
            <p id="status" class="text-center text-sm font-medium hidden"></p>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxGe5NRflmghfaX2x3jYUDhTqyoo-DoqFgWt_Z1ZhUKsPLRAyS_4d_pVx43VjBnKcxbUg/exec"; // REEMPLAZA ESTO
        let metaDataExtraida = null;

        document.getElementById('foto').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Vista previa
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('preview').src = e.target.result;
                document.getElementById('preview').classList.remove('hidden');
                document.getElementById('uploadPrompt').classList.add('hidden');
            };
            reader.readAsDataURL(file);

            // Extraer Metadatos
            EXIF.getData(file, function() {
                const tags = EXIF.getAllTags(this);
                const lat = tags.GPSLatitude ? formatGPS(tags.GPSLatitude, tags.GPSLatitudeRef) : "N/A";
                const lon = tags.GPSLongitude ? formatGPS(tags.GPSLongitude, tags.GPSLongitudeRef) : "N/A";

                metaDataExtraida = {
                    marca: tags.Make || "Desconocida",
                    modelo: tags.Model || "Desconocido",
                    fechaCaptura: tags.DateTime || "Sin fecha EXIF",
                    latitud: lat,
                    longitud: lon,
                    mapa: lat !== "N/A" ? `https://www.google.com/maps?q=${lat},${lon}` : "N/A"
                };

                // Activar botón si hay datos
                const btn = document.getElementById('btnEnviar');
                btn.disabled = false;
                btn.classList.replace('bg-gray-400', 'bg-green-600');
            });
        });

        document.getElementById('btnEnviar').onclick = async function() {
            const status = document.getElementById('status');
            const btn = this;
            
            // Validar campos de texto
            const payload = {
                promotor: document.getElementById('nombre').value,
                idHonor: document.getElementById('idHonor').value,
                region: document.getElementById('region').value,
                sucursal: document.getElementById('sucursal').value,
                ...metaDataExtraida
            };

            if(!payload.promotor || !payload.idHonor) {
                alert("Por favor completa tu nombre e ID");
                return;
            }

            btn.disabled = true;
            btn.innerText = "ENVIANDO...";
            status.classList.remove('hidden', 'text-red-500');
            status.classList.add('text-blue-600');
            status.innerText = "Subiendo datos a la central...";

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload)
                });
                
                status.innerText = "✅ Reporte enviado con éxito";
                status.classList.replace('text-blue-600', 'text-green-600');
                btn.innerText = "ENVIADO";
                btn.classList.replace('bg-green-600', 'bg-blue-800');
            } catch (error) {
                status.innerText = "❌ Error al enviar";
                status.classList.add('text-red-500');
                btn.disabled = false;
                btn.innerText = "REINTENTAR";
            }
        };

        function formatGPS(coords, ref) {
            const deg = coords[0] + (coords[1]/60) + (coords[2]/3600);
            return (ref === "S" || ref === "W" ? -deg : deg).toFixed(6);
        }
    </script>
</body>
</html>
